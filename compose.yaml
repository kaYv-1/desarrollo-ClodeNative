services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: pedidos360
      RABBITMQ_DEFAULT_PASS: pedidos360-local
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-admin:
    build:
      context: ./pedidos360-rabbitmq-admin
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: pedidos360
      RABBITMQ_PASSWORD: pedidos360-local
    ports:
      - "8081:8081"

volumes:
  rabbitmq-data:
