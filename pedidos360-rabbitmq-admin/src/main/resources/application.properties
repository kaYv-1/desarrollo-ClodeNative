spring.application.name=pedidos360-rabbitmq-admin
server.port=${SERVER_PORT:8081}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360-local}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/77747a67-519b-49e8-a701-13c4e011672c/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_AUDIENCE:api://cca6baa4-4933-4d00-b8a9-8c899dbfba57,cca6baa4-4933-4d00-b8a9-8c899dbfba57}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

app.messaging.orders-exchange=pedidos360.orders
app.messaging.dead-letter-exchange=pedidos360.dead-letter
app.messaging.notifications-queue=pedidos360.order-notifications
app.messaging.notifications-dead-letter-queue=pedidos360.order-notifications.dlq
app.messaging.notifications-routing-key=order.created.notifications
app.messaging.notifications-dead-letter-routing-key=order.notifications.dlq
app.messaging.tickets-queue=pedidos360.order-tickets
app.messaging.tickets-dead-letter-queue=pedidos360.order-tickets.dlq
app.messaging.tickets-routing-key=order.created.tickets
app.messaging.tickets-dead-letter-routing-key=order.tickets.dlq
app.messaging.documents-queue=pedidos360.order-documents
app.messaging.documents-dead-letter-queue=pedidos360.order-documents.dlq
app.messaging.documents-routing-key=order.created.documents
app.messaging.documents-dead-letter-routing-key=order.documents.dlq
