spring.application.name=pedidos360-rabbitmq-admin
server.port=${SERVER_PORT:8081}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360-local}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/77747a67-519b-49e8-a701-13c4e011672c/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_AUDIENCE:api://cca6baa4-4933-4d00-b8a9-8c899dbfba57,cca6baa4-4933-4d00-b8a9-8c899dbfba57}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

app.messaging.order-created-exchange=pedidos360.orders
app.messaging.order-created-queue=pedidos360.orders.notifications
app.messaging.order-created-routing-key=orders.created
app.messaging.dead-letter-exchange=pedidos360.dead-letter
app.messaging.dead-letter-queue=pedidos360.orders.notifications.dlq
app.messaging.dead-letter-routing-key=orders.created.failed
