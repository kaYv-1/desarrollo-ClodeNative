spring.application.name=pedidos360-backend
spring.profiles.default=h2

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos360-local}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.template.mandatory=true
app.messaging.order-created-exchange=pedidos360.orders
app.messaging.order-created-queue=pedidos360.orders.notifications
app.messaging.order-created-routing-key=orders.created
app.messaging.dead-letter-exchange=pedidos360.dead-letter
app.messaging.dead-letter-queue=pedidos360.orders.notifications.dlq
app.messaging.dead-letter-routing-key=orders.created.failed

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:pedidos360-orders}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:false}
spring.kafka.admin.auto-create=${KAFKA_ADMIN_AUTO_CREATE:false}
app.kafka.order-created-topic=${KAFKA_ORDER_CREATED_TOPIC:pedidos360.orders.created}
app.kafka.order-notification-topic=${KAFKA_ORDER_NOTIFICATION_TOPIC:pedidos360.orders.notifications}
app.kafka.partitions=${KAFKA_TOPIC_PARTITIONS:3}
app.kafka.replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:3}
app.kafka.retention-ms=${KAFKA_TOPIC_RETENTION_MS:604800000}
app.kafka.cleanup-policy=${KAFKA_TOPIC_CLEANUP_POLICY:delete}

# Azure AD resource server config
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/77747a67-519b-49e8-a701-13c4e011672c/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_AUDIENCE:api://cca6baa4-4933-4d00-b8a9-8c899dbfba57,cca6baa4-4933-4d00-b8a9-8c899dbfba57}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
