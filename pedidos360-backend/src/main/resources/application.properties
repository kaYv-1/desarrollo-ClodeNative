spring.application.name=pedidos360-backend
spring.profiles.default=h2

# Azure AD resource server config
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/77747a67-519b-49e8-a701-13c4e011672c/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_AUDIENCE:api://cca6baa4-4933-4d00-b8a9-8c899dbfba57,cca6baa4-4933-4d00-b8a9-8c899dbfba57}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}

# RabbitMQ messaging topology and connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.rabbitmq.exchange-orders=${RABBITMQ_ORDERS_EXCHANGE:pedidos360.orders}
app.rabbitmq.queue.order-notifications=${RABBITMQ_ORDER_QUEUE:pedidos360.order-notifications}
app.rabbitmq.queue.order-notifications-dlq=${RABBITMQ_ORDER_DLQ:pedidos360.order-notifications.dlq}
app.rabbitmq.routing-key-order-created=${RABBITMQ_ORDER_CREATED_KEY:order.created}
app.rabbitmq.exchange-dead-letter=${RABBITMQ_DLX:pedidos360.dead-letter}

# JPA/Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
